<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="G8 Yatch Villa Hotel in Embu for rooms, restaurant meals, drinks, meetings, family events, team building and cabro block enquiries."
    />
    <meta property="og:title" content="G8 Yatch Villa Hotel Embu" />
    <meta
      property="og:description"
      content="Plan a visit to G8 in Embu: hotel rooms, restaurant service, events, meetings and cabro block enquiries from one local team."
    />
    <meta property="og:type" content="website" />
    <script>
      (() => {
        let saved
        try {
          saved = localStorage.getItem('g8_theme')
        } catch {
          saved = null
        }
        const validSaved = saved === 'light' || saved === 'dark'
        const dark = validSaved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <title>G8 Yatch Villa Hotel Embu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
