services:
  app-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: g8_yacht
      POSTGRES_USER: g8_yacht
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD}
    volumes:
      - g8_app_postgres_data:/var/lib/postgresql/data
    networks:
      - g8net

  keycloak-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - g8_keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - g8net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - app-postgres
      - keycloak-postgres
    volumes:
      - backend_staticfiles:/app/staticfiles
      - backend_media:/app/media
    networks:
      - g8net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - g8net

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: identy.getotech.co.ke
      KC_HOSTNAME_STRICT: "true"
    command: ["start", "--hostname", "identy.getotech.co.ke", "--http-enabled=true", "--proxy-headers", "xforwarded"]
    depends_on:
      - keycloak-postgres
    networks:
      - g8net

  caddy:
    image: caddy:latest
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend
      - keycloak
    networks:
      - g8net

volumes:
  g8_app_postgres_data:
  g8_keycloak_postgres_data:
  backend_staticfiles:
  backend_media:
  caddy_data:
  caddy_config:

networks:
  g8net:
    driver: bridge
