services:
  app-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: g8_yacht
      POSTGRES_USER: g8_yacht
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD}
    volumes:
      - g8_app_postgres_data:/var/lib/postgresql/data
    networks:
      - g8net

  keycloak-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - g8_keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - g8net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - app-postgres
      - keycloak-postgres
    volumes:
      - backend_staticfiles:/app/staticfiles
      - backend_media:/app/media
    networks:
      - g8net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-https://identy.getotech.co.ke}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-g8-yacht}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-pos-terminal}
        VITE_WINDOWS_OFFLINE_BUNDLE_URL: ${VITE_WINDOWS_OFFLINE_BUNDLE_URL:-/downloads/G8-Yacht-Villa-Offline-Windows.zip}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - g8net

  landing_frontend:
    build:
      context: .
      dockerfile: g8_landing_frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://g8-backend.getotech.co.ke}
        VITE_USE_MOCK_DATA: ${VITE_USE_MOCK_DATA:-false}
        VITE_CRM_LEADS_ENDPOINT: ${VITE_CRM_LEADS_ENDPOINT:-}
        VITE_CABRO_ORDERS_ENDPOINT: ${VITE_CABRO_ORDERS_ENDPOINT:-}
        VITE_GOOGLE_MAP_QUERY: ${VITE_GOOGLE_MAP_QUERY:-G8 YATCH VILLA HOTEL}
        VITE_GOOGLE_MAP_EMBED_URL: ${VITE_GOOGLE_MAP_EMBED_URL:-https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3989.572965093953!2d37.5472915762844!3d-0.6354201352638502!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x182639617a98ae4f%3A0xd45d55ee4bc3c5a7!2sG8%20YATCH%20VILLA%20HOTEL!5e0!3m2!1sen!2ske!4v1783357275305!5m2!1sen!2ske}
        VITE_GOOGLE_MAP_URL: ${VITE_GOOGLE_MAP_URL:-https://maps.app.goo.gl/YHtT1xqLvT9CN764A}
        VITE_HOTEL_ENQUIRIES_ENDPOINT: ${VITE_HOTEL_ENQUIRIES_ENDPOINT:-}
        VITE_WAITER_ALERT_ENDPOINT: ${VITE_WAITER_ALERT_ENDPOINT:-}
        VITE_CONTACT_PHONE: ${VITE_CONTACT_PHONE:-}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
    restart: unless-stopped
    networks:
      - g8net

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: identy.getotech.co.ke
      KC_HOSTNAME_STRICT: "true"
    command: ["start", "--hostname", "identy.getotech.co.ke", "--http-enabled=true", "--proxy-headers", "xforwarded"]
    depends_on:
      - keycloak-postgres
    networks:
      - g8net

  caddy:
    image: caddy:latest
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend
      - landing_frontend
      - keycloak
    networks:
      - g8net

volumes:
  g8_app_postgres_data:
  g8_keycloak_postgres_data:
  backend_staticfiles:
  backend_media:
  caddy_data:
  caddy_config:

networks:
  g8net:
    driver: bridge
